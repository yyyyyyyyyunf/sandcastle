name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for npm publish --provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm run typecheck
      # build before test: cli tests exec the compiled dist/main.js
      - run: npm run build
      # git-heavy tests are slow under parallel load; the default 5s vitest
      # timeout is too tight on shared runners
      - run: npm test -- --testTimeout=20000
      - name: Verify build artifacts
        run: |
          set -e
          for f in \
            dist/index.js dist/index.d.ts dist/main.js \
            dist/sandboxes/docker.js dist/sandboxes/docker.d.ts \
            dist/sandboxes/podman.js dist/sandboxes/podman.d.ts \
            dist/sandboxes/vercel.js dist/sandboxes/vercel.d.ts \
            dist/sandboxes/daytona.js dist/sandboxes/daytona.d.ts \
            dist/sandboxes/no-sandbox.js dist/sandboxes/no-sandbox.d.ts \
            dist/templates; do
            [ -e "$f" ] || { echo "::error file=$f::missing"; exit 1; }
          done
      - name: Check tag matches package version
        run: |
          set -e
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          [ "$TAG_VERSION" = "$PKG_VERSION" ] || { echo "::error::tag/version mismatch"; exit 1; }
      - name: Publish to npm
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_SECRET }}
